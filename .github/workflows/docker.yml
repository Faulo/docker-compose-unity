name: Docker

on:
    push:
        branches:
            - "main"
        paths:
            - "common/**"
            - "linux/**"
            - "windows/**"
            - ".github/workflows/docker.yml"
    workflow_dispatch:
    schedule:
        - cron: "17 3 1 * *"

permissions:
    contents: read

concurrency:
    group: docker-publish
    cancel-in-progress: false

jobs:
    test-linux:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up .NET
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  dotnet-version: 9.0.x
            - name: Run unit tests
              run: dotnet test common/ComposeUnity.Tests/ComposeUnity.Tests.csproj --nologo --configuration Release
            - name: Register Linux Docker context
              run: docker context create linux --docker host=unix:///var/run/docker.sock
            - name: Run real-daemon tests
              run: dotnet test common/ComposeUnity.DaemonTests/ComposeUnity.DaemonTests.csproj --nologo --configuration Release

    test-windows:
        runs-on: windows-2022
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up .NET
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  dotnet-version: 9.0.x
            - name: Configure Hyper-V as Docker default isolation
              shell: pwsh
              run: |
                  Stop-Service docker
                  $standardOutput = Join-Path $env:RUNNER_TEMP "dockerd.stdout.log"
                  $standardError = Join-Path $env:RUNNER_TEMP "dockerd.stderr.log"
                  $daemon = Start-Process -FilePath (Get-Command dockerd).Source `
                      -ArgumentList "--exec-opt=isolation=hyperv" `
                      -RedirectStandardOutput $standardOutput -RedirectStandardError $standardError `
                      -WindowStyle Hidden -PassThru
                  for ($attempt = 1; $attempt -le 60; $attempt++) {
                      $isolation = docker info --format "{{.Isolation}}" 2>$null
                      if ($LASTEXITCODE -eq 0 -and $isolation.Trim() -eq "hyperv") {
                          exit 0
                      }
                      if ($daemon.HasExited) {
                          Write-Output "dockerd stdout:"
                          Get-Content -LiteralPath $standardOutput
                          Write-Output "dockerd stderr:"
                          Get-Content -LiteralPath $standardError
                          throw "dockerd exited with code $($daemon.ExitCode)."
                      }
                      Start-Sleep -Seconds 1
                  }
                  throw "Docker did not start with Hyper-V as its default isolation within 60 seconds."
            - name: Register Windows Docker context
              shell: pwsh
              run: docker context create windows --docker "host=npipe:////./pipe/docker_engine"
            - name: Run Windows real-daemon tests
              run: dotnet test common/ComposeUnity.DaemonTests/ComposeUnity.DaemonTests.csproj --nologo --configuration Release

    configuration:
        needs:
            - test-linux
            - test-windows
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            image: ${{steps.image.outputs.DOCKER_IMAGE}}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Read image name
              id: image
              shell: bash
              run: grep -m1 '^DOCKER_IMAGE=' .env >> "${GITHUB_OUTPUT}"

    publish:
        needs: configuration
        uses: Faulo/workflows-docker/.github/workflows/publish.yml@v1
        with:
            image: ${{needs.configuration.outputs.image}}
            linux_context: .
            windows_context: .
            windows_variants: >-
                [
                  {"tag":"windows-20H2","build_args":{"OS_BASE":"20H2"}},
                  {"tag":"windows-1809","build_args":{"OS_BASE":"1809"}}
                ]
        secrets:
            DOCKERHUB_USERNAME: ${{secrets.DOCKERHUB_USERNAME}}
            DOCKERHUB_TOKEN: ${{secrets.DOCKERHUB_TOKEN}}
